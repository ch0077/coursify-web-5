<div class="container d-flex justify-content-center mt-5">
  <div class="glass-card p-4 w-100" style="max-width: 650px;">
    
    <div class="d-flex align-items-center mb-4">
      <i class="fa-solid fa-cart-shopping fs-3 text-white me-3"></i>
      <h2 class="text-white mb-0 fw-bold">Seu Carrinho</h2>
    </div>

    <div class="lista-itens mb-4">
      <div *ngFor="let item of itens" class="cart-item p-3 mb-3 rounded">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h5 class="text-white mb-1 fw-bold">{{ item.nome }}</h5>
            <p class="text-white-50 small mb-2">{{ item.descricao }}</p>
            <span class="badge bg-secondary mb-0">Carga Horária: {{ item.cargaHoraria }}</span>
          </div>
          <p class="text-success fw-bold fs-5">{{ item.preco | currency:'BRL' }}</p>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end align-items-center mb-4 p-3 bg-dark rounded shadow-sm">
      <span class="text-white me-3 fs-5">Total da Compra:</span>
      <span class="text-info fw-bold fs-3">{{ valorTotal | currency:'BRL' }}</span>
    </div>

    <hr class="border-white" style="opacity: 0.2;">

    <div class="d-flex justify-content-between align-items-center mt-4">
      <a href="/" class="text-white-50 text-decoration-none">
        <i class="fa-solid fa-arrow-left me-2"></i>Voltar
      </a>
      <button (click)="finalizarCompra()" class="btn btn-action rounded-pill px-5 py-2 fw-bold">
        Finalizar Compra
      </button>
    </div>

  </div>
</div>
